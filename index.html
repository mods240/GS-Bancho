<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080b10">
<title>ガス番長</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── SPLASH ── -->
<div id="splash">
  <div class="splash-eyebrow">FUEL FINDER</div>
  <div class="splash-logo">ガス<em>番長</em></div>
  <div class="splash-sub">PRICE · NAVIGATE</div>
  <div class="splash-bar"><div class="splash-bar-fill"></div></div>
</div>

<!-- ── APP ── -->
<div id="app" class="hidden">

  <header>
    <div class="logo">
      ガス<em>番長</em>
      <span class="logo-badge">FUEL FINDER</span>
    </div>
    <div class="loc-pill">
      <span class="loc-dot"></span>
      <span id="loc-text">位置取得中…</span>
    </div>
  </header>

  <main>

    <!-- STEP 1: 現在地周辺を検索 -->
    <section class="action-area">
      <div class="section-label" style="margin-bottom:6px">
        <span class="section-num">01</span>
        <span class="section-title">現在地周辺の最安値を検索</span>
        <span class="section-line"></span>
      </div>
      <button class="btn-main" onclick="openGogoGSNearby()">
        <span class="btn-main-icon">⛽</span>
        <div class="btn-main-body">
          <div class="btn-main-title">現在地周辺の最安値を探す</div>
          <div class="btn-main-desc">gogo.gs → 現在地ピンポイントで開く</div>
        </div>
        <span class="btn-main-arrow">›</span>
      </button>
    </section>

    <!-- STEP 2: ナビ -->
    <section class="card">
      <div class="section-label">
        <span class="section-num">02</span>
        <span class="section-title">ナビ起動</span>
        <span class="section-line"></span>
      </div>
      <div class="nav-row">
        <div class="input-wrap" style="flex:1">
          <span class="input-icon">⛽</span>
          <input id="station-input" type="text"
            placeholder="スタンド名 or 住所"
            autocomplete="off">
        </div>
        <button class="btn-nav" onclick="openMapsNav()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          ナビ開始
        </button>
      </div>
      <div class="hint">// gogo.gsで選んだスタンド名をここに貼り付け</div>
    </section>

    <!-- TIPS -->
    <section class="card">
      <div class="section-label">
        <span class="section-num" style="font-size:1rem;color:var(--gold)">TIP</span>
        <span class="section-title">使い方</span>
        <span class="section-line"></span>
      </div>
      <div class="tips-grid">
        <div class="tip-item">
          <span class="tip-num">1</span>
          <span class="tip-text">最安値を探すをタップ</span>
        </div>
        <div class="tip-item">
          <span class="tip-num">2</span>
          <span class="tip-text">マップで周辺を確認</span>
        </div>
        <div class="tip-item">
          <span class="tip-num">3</span>
          <span class="tip-text">スタンド名をコピー</span>
        </div>
        <div class="tip-item">
          <span class="tip-num">4</span>
          <span class="tip-text">戻ってナビ開始をタップ</span>
        </div>
      </div>
    </section>

    <!-- 価格メモ -->
    <section class="card">
      <div class="section-label">
        <span class="section-num" style="font-size:1rem;color:var(--muted)">REC</span>
        <span class="section-title">価格メモ</span>
        <span class="section-line"></span>
      </div>
      <div id="memo-list"></div>
      <button class="btn-add-memo" onclick="openMemoModal()">＋ 今日の価格を記録</button>
    </section>

  </main>
</div>

<!-- ── MODAL ── -->
<div class="overlay" id="overlay" onclick="closeOverlay(event)">
  <div class="mbox">
    <div class="mbox-handle"></div>
    <div class="mtitle">📝 給油メモ</div>
    <div class="mfield">
      <label>スタンド名</label>
      <input class="minput" id="m-name" type="text" placeholder="ENEOS ○○SS">
    </div>
    <div class="mrow2">
      <div class="mfield">
        <label>価格 (円/L)</label>
        <input class="minput large" id="m-price" type="number" min="100" max="300" placeholder="168">
      </div>
      <div class="mfield">
        <label>給油量 (L)</label>
        <input class="minput large" id="m-liter" type="number" min="1" max="200" placeholder="30">
      </div>
    </div>
    <div class="mfield">
      <label>メモ</label>
      <input class="minput" id="m-note" type="text" placeholder="高速道路の手前など">
    </div>
    <div class="mbtns">
      <button class="mbtn-cancel" onclick="closeOverlayDirect()">キャンセル</button>
      <button class="mbtn-save" onclick="saveMemo()">保存</button>
    </div>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>

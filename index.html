<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080b10">
<title>ガス番長</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── SPLASH ── -->
<div id="splash">
  <div class="splash-eyebrow">FUEL FINDER</div>
  <div class="splash-logo">ガス<em>番長</em></div>
  <div class="splash-sub">PRICE · NAVIGATE</div>
  <div class="splash-bar"><div class="splash-bar-fill"></div></div>
</div>

<!-- ── APP ── -->
<div id="app" class="hidden">

  <header>
    <div class="logo">
      ガス<em>番長</em>
      <span class="logo-badge">FUEL FINDER</span>
    </div>
    <div class="loc-pill">
      <span class="loc-dot"></span>
      <span id="loc-text">位置取得中…</span>
    </div>
  </header>

  <main class="main-center">

    <!-- メインボタン -->
    <button class="btn-hero" onclick="openGogoGSNearby()">
      <span class="btn-hero-icon">⛽</span>
      <div class="btn-hero-title">現在地周辺の<br>最安値を探す</div>
      <div class="btn-hero-desc">TAP TO FIND CHEAPEST GAS</div>
    </button>

    <!-- 価格メモ -->
    <section class="card">
      <div class="section-label">
        <span class="section-num" style="font-size:1rem;color:var(--muted)">REC</span>
        <span class="section-title">価格メモ</span>
        <span class="section-line"></span>
      </div>
      <div id="memo-list"></div>
      <button class="btn-add-memo" onclick="openMemoModal()">＋ 今日の価格を記録</button>
    </section>

  </main>
</div>

<!-- ── MODAL ── -->
<div class="overlay" id="overlay" onclick="closeOverlay(event)">
  <div class="mbox">
    <div class="mbox-handle"></div>
    <div class="mtitle">📝 給油メモ</div>
    <div class="mfield">
      <label>スタンド名</label>
      <input class="minput" id="m-name" type="text" placeholder="ENEOS ○○SS">
    </div>
    <div class="mrow2">
      <div class="mfield">
        <label>価格 (円/L)</label>
        <input class="minput large" id="m-price" type="number" min="100" max="300" placeholder="168">
      </div>
      <div class="mfield">
        <label>給油量 (L)</label>
        <input class="minput large" id="m-liter" type="number" min="1" max="200" placeholder="30">
      </div>
    </div>
    <div class="mfield">
      <label>メモ</label>
      <input class="minput" id="m-note" type="text" placeholder="高速道路の手前など">
    </div>
    <div class="mbtns">
      <button class="mbtn-cancel" onclick="closeOverlayDirect()">キャンセル</button>
      <button class="mbtn-save" onclick="saveMemo()">保存</button>
    </div>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
